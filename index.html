<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCore Enterprise Workspace - Instagram Dark UI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            base: '#000000',
                            surface: '#09090b',
                            card: '#121214',
                            border: '#27272a'
                        },
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #f4f4f5;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }

        .ig-card {
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 1.25rem;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
        }

        .ig-glass {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid #27272a;
        }
        
        .transition-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white pb-16 md:pb-0">

    <!-- Mobile Backdrop Overlay -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-30 hidden md:hidden transition-smooth"></div>

    <!-- App Container -->
    <div id="app" class="flex h-screen overflow-hidden relative">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 z-40 w-72 bg-[#09090b] border-r border-[#27272a] flex flex-col transform transition-transform duration-300 ease-in-out shadow-2xl md:shadow-none">
            <div class="h-16 flex items-center justify-between px-6 border-b border-[#27272a]">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-brand-600/30">
                        SC
                    </div>
                    <span class="font-bold text-lg tracking-tight text-white">SmartCore</span>
                </div>
                <!-- Close Button -->
                <button id="sidebar-close" class="text-zinc-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Navigation Links Container -->
            <nav id="nav-links" class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto">
                <!-- Dynamic Navigation Rendered Here -->
            </nav>

            <!-- Sidebar Footer / Status -->
            <div class="p-4 border-t border-[#27272a] space-y-3 bg-[#000000]/40">
                <div class="flex items-center justify-between text-xs text-zinc-400">
                    <span>Storage Status</span>
                    <span id="storage-indicator" class="px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-medium">Optimal</span>
                </div>
                <div class="flex items-center justify-between text-xs text-zinc-400">
                    <span>GitHub Sync</span>
                    <span id="github-sync-badge" class="px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 font-medium flex items-center space-x-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-ping"></span>
                        <span>Connected</span>
                    </span>
                </div>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-[#000000]">
            
            <!-- Sleek Header -->
            <header class="h-16 ig-glass flex items-center justify-between px-4 md:px-8 z-10">
                <div class="flex items-center space-x-3 md:space-x-4 min-w-0">
                    <button id="sidebar-toggle" class="p-2 rounded-xl text-zinc-400 hover:text-white hover:bg-[#27272a]/50 transition-smooth shrink-0" title="Toggle Sidebar">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <h1 id="page-title" class="text-sm md:text-base font-semibold tracking-tight text-white truncate">Dashboard Overview</h1>
                </div>
                
                <div class="flex items-center space-x-2 md:space-x-4 shrink-0">
                    <button id="btn-open-github-config" class="inline-flex items-center space-x-1.5 text-xs bg-[#121214] hover:bg-[#27272a] text-zinc-200 px-3 py-2 rounded-xl border border-[#27272a] transition-smooth">
                        <svg class="w-4 h-4 text-zinc-400 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                        <span id="github-repo-label" class="truncate max-w-[120px] md:max-w-none">GitHub Sync</span>
                    </button>
                    <div id="sync-status" class="hidden sm:flex text-xs text-zinc-400 items-center space-x-1.5 bg-[#121214] px-3 py-2 rounded-xl border border-[#27272a]">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span>Synced</span>
                    </div>
                </div>
            </header>

            <!-- Workspace Content -->
            <main id="main-workspace" class="flex-1 overflow-y-auto p-4 md:p-8 bg-[#000000] pb-24 md:pb-8">
                <!-- Dynamic Views Rendered Here -->
            </main>

        </div>
    </div>

    <!-- Instagram-style Bottom Navigation Bar for Mobile -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 h-16 ig-glass flex items-center justify-around px-4 z-40 border-t border-[#27272a]" style="background: rgba(9, 9, 11, 0.95);">
        <button onclick="switchTab('dashboard')" class="flex flex-col items-center justify-center text-zinc-400 hover:text-white transition-smooth" id="bottom-nav-dashboard">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] mt-1 font-medium">Dashboard</span>
        </button>
        <button onclick="switchTab('management')" class="flex flex-col items-center justify-center text-zinc-400 hover:text-white transition-smooth" id="bottom-nav-management">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
            <span class="text-[10px] mt-1 font-medium">Management</span>
        </button>
    </div>

    <!-- UI Templates -->
    <template id="nav-item-template">
        <a href="#" class="nav-item flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium text-zinc-400 hover:text-white hover:bg-[#121214] transition-smooth group">
            <span class="icon-wrapper text-zinc-500 group-hover:text-brand-500 transition-smooth"></span>
            <span class="text-sm"></span>
        </a>
    </template>

    <template id="view-dashboard">
        <div class="space-y-6 animate-fadeIn max-w-7xl mx-auto">
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="ig-card p-6 relative overflow-hidden">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Total Records</p>
                            <h3 id="stat-total-records" class="text-3xl font-bold text-white mt-2">0</h3>
                        </div>
                        <div class="p-3 bg-brand-500/10 text-brand-500 rounded-2xl border border-brand-500/20">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-emerald-400 font-medium space-x-1">
                        <span>GitHub Real-Time Connected</span>
                    </div>
                </div>

                <div class="ig-card p-6 relative overflow-hidden">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Sync Status</p>
                            <h3 id="stat-sync-status" class="text-lg font-bold text-emerald-400 mt-2 truncate">Synchronized</h3>
                        </div>
                        <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-2xl border border-emerald-500/20">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-zinc-400 font-medium">
                        <span id="stat-last-sync">Terakhir sync: Belum pernah</span>
                    </div>
                </div>

                <div class="ig-card p-6 relative overflow-hidden">
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-xs font-semibold uppercase tracking-wider text-zinc-400">Storage Usage</p>
                            <h3 id="stat-storage-size" class="text-3xl font-bold text-white mt-2">0 KB</h3>
                        </div>
                        <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-2xl border border-indigo-500/20">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>
                        </div>
                    </div>
                    <div class="mt-4 flex items-center text-xs text-indigo-400 font-medium">
                        <span>Local + GitHub Buffer</span>
                    </div>
                </div>
            </div>

            <!-- Synchronization Center Panel -->
            <div class="ig-card p-6 md:p-8 space-y-4">
                <h2 class="text-lg font-semibold text-white">GitHub Real-Time Synchronization Center</h2>
                <p class="text-sm text-zinc-400 leading-relaxed">Setiap mutasi data (Tambah, Edit, Hapus) secara otomatis di-push secara real-time ke Repositori GitHub Anda menggunakan Personal Access Token (PAT).</p>
                <div class="flex items-center space-x-3 pt-2">
                    <button id="btn-manual-sync" class="inline-flex items-center space-x-2 bg-[#18181b] hover:bg-[#27272a] text-white px-5 py-2.5 rounded-xl text-xs font-medium border border-[#27272a] transition-smooth">
                        <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        <span>Force Sync Now</span>
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="view-management">
        <div class="space-y-6 animate-fadeIn max-w-7xl mx-auto">
            <!-- Action Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                <div class="relative flex-1 max-w-md">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-zinc-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="search-input" placeholder="Cari data berdasarkan nama atau kategori..." class="w-full bg-[#121214] border border-[#27272a] rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-brand-500 transition-smooth">
                </div>
                <button id="btn-open-modal" class="inline-flex items-center justify-center space-x-2 bg-brand-600 hover:bg-brand-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm shadow-lg shadow-brand-600/30 transition-smooth">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    <span>Tambah Data Baru</span>
                </button>
            </div>

            <!-- Data Table Container -->
            <div class="ig-card overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="border-b border-[#27272a] bg-[#18181b]/50 text-xs font-semibold text-zinc-400 uppercase tracking-wider">
                                <th class="py-4 px-6">ID & Waktu</th>
                                <th class="py-4 px-6">Nama Item</th>
                                <th class="py-4 px-6">Kategori</th>
                                <th class="py-4 px-6">Status</th>
                                <th class="py-4 px-6 text-right">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="data-table-body" class="divide-y divide-[#27272a] text-sm text-zinc-300"></tbody>
                    </table>
                </div>
                <!-- Empty State -->
                <div id="table-empty-state" class="hidden py-16 text-center">
                    <p class="text-zinc-400 font-medium">Belum ada data tersedia.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- Modals -->
    <div id="app-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden transition-smooth">
        <div class="ig-card w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-[#27272a] bg-[#18181b]">
                <h3 id="modal-title" class="font-semibold text-white text-base">Tambah Item Baru</h3>
                <button id="btn-close-modal" class="text-zinc-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <form id="data-form" class="p-6 space-y-4">
                <input type="hidden" id="item-id">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Nama Item</label>
                    <input type="text" id="item-name" required placeholder="Nama item..." class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Kategori</label>
                    <select id="item-category" class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="Infrastructure">Infrastructure</option>
                        <option value="Development">Development</option>
                        <option value="Operations">Operations</option>
                        <option value="Security">Security</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Status</label>
                    <select id="item-status" class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                        <option value="Active">Active</option>
                        <option value="Pending">Pending</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-[#27272a]">
                    <button type="button" id="btn-cancel-modal" class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:bg-[#27272a]">Batal</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-brand-600 hover:bg-brand-500 text-white shadow-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <div id="github-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden transition-smooth">
        <div class="ig-card w-full max-w-lg overflow-hidden shadow-2xl">
            <div class="flex items-center justify-between px-6 py-4 border-b border-[#27272a] bg-[#18181b]">
                <h3 class="font-semibold text-white text-base">Konfigurasi GitHub Sync</h3>
                <button id="btn-close-github-modal" class="text-zinc-400 hover:text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>
            </div>
            <form id="github-config-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Owner / Username</label>
                    <input type="text" id="gh-owner" required class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Repository</label>
                    <input type="text" id="gh-repo" required class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">File Path</label>
                    <input type="text" id="gh-path" required value="data/smartcore-state.json" class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Branch</label>
                    <input type="text" id="gh-branch" required value="main" class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-zinc-400 uppercase tracking-wider mb-2">Personal Access Token (PAT)</label>
                    <input type="password" id="gh-token" required class="w-full bg-[#000000] border border-[#27272a] rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-brand-500">
                </div>
                <div class="flex items-center justify-end space-x-3 pt-4 border-t border-[#27272a]">
                    <button type="button" id="btn-cancel-github-modal" class="px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-400 hover:bg-[#27272a]">Batal</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-sm font-medium bg-brand-600 hover:bg-brand-500 text-white shadow-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Engine -->

            navItems: [
                { id: 'dashboard', label: 'Dashboard', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-16zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-16z"/></svg>' },
                { id: 'management', label: 'Data Management', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>' }
            ],
            items: [
                { id: 'REC-001', name: 'Core Gateway Server', category: 'Infrastructure', status: 'Active', createdAt: '2026-06-01 08:30' },
                { id: 'REC-002', name: 'Authentication Microservice', category: 'Development', status: 'Active', createdAt: '2026-06-02 10:15' },
                { id: 'REC-003', name: 'Automated Backup Pipeline', category: 'Operations', status: 'Pending', createdAt: '2026-06-03 14:00' }
            ]
        };

        function loadStateFromStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState.items = parsed.items || appState.items;
                    appState.currentTab = parsed.currentTab || 'dashboard';
                    appState.lastSyncTime = parsed.lastSyncTime || null;
                }
                const savedGhConfig = localStorage.getItem(GH_CONFIG_KEY);
                if (savedGhConfig) {
                    appState.githubConfig = JSON.parse(savedGhConfig);
                }
            } catch (error) {
                console.error('Storage error:', error);
            }
        }

        function saveStateToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    items: appState.items,
                    currentTab: appState.currentTab,
                    lastSyncTime: appState.lastSyncTime
                }));
                updateStorageIndicator();
                triggerGitHubSync();
            } catch (error) {
                console.error('Save error:', error);
            }
        }

        let isSyncing = false;
        async function triggerGitHubSync() {
            const config = appState.githubConfig;
            if (!config.owner || !config.repo || !config.token) {
                updateSyncBadge('not-configured', 'GitHub Belum Dikonfigurasi');
                return;
            }
            if (isSyncing) return;
            isSyncing = true;
            updateSyncBadge('syncing', 'Menyelaraskan...');

            try {
                const apiEndpoint = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;
                const headers = {
                    'Authorization': `token ${config.token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                };

                let fileSha = null;
                try {
                    const getRes = await fetch(`${apiEndpoint}?ref=${config.branch}`, { headers });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        fileSha = fileData.sha;
                    }
                } catch (e) {}

                const contentData = JSON.stringify({
                    items: appState.items,
                    updatedAt: new Date().toISOString(),
                    version: '1.8'
                }, null, 2);

                const base64Content = btoa(unescape(encodeURIComponent(contentData)));
                const bodyPayload = {
                    message: `SmartCore Auto-Sync: Update state data (${new Date().toLocaleString()})`,
                    content: base64Content,
                    branch: config.branch
                };
                if (fileSha) bodyPayload.sha = fileSha;

                const putRes = await fetch(apiEndpoint, {
                    method: 'PUT',
                    headers: headers,
                    body: JSON.stringify(bodyPayload)
                });

                if (putRes.ok) {
                    appState.lastSyncTime = new Date().toLocaleTimeString();
                    updateSyncBadge('synced', 'Synced');
                    updateDashboardSyncStats();
                } else {
                    updateSyncBadge('error', 'Gagal Sync');
                }
            } catch (error) {
                updateSyncBadge('error', 'Koneksi Gagal');
            } finally {
                isSyncing = false;
            }
        }

        function updateSyncBadge(status, text) {
            const badge = document.getElementById('github-sync-badge');
            const repoLabel = document.getElementById('github-repo-label');
            if (badge) {
                if (status === 'synced') {
                    badge.className = 'px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-medium flex items-center space-x-1';
                    badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span><span>${text}</span>`;
                } else if (status === 'syncing') {
                    badge.className = 'px-2 py-0.5 rounded-full bg-blue-500/10 text-blue-400 font-medium flex items-center space-x-1';
                    badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-ping"></span><span>${text}</span>`;
                } else if (status === 'error') {
                    badge.className = 'px-2 py-0.5 rounded-full bg-rose-500/10 text-rose-400 font-medium flex items-center space-x-1';
                    badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span><span>${text}</span>`;
                } else {
                    badge.className = 'px-2 py-0.5 rounded-full bg-zinc-500/10 text-zinc-400 font-medium flex items-center space-x-1';
                    badge.innerHTML = `<span>${text}</span>`;
                }
            }
            if (repoLabel && appState.githubConfig.repo) {
                repoLabel.textContent = `${appState.githubConfig.owner}/${appState.githubConfig.repo}`;
            }
        }

        function updateDashboardSyncStats() {
            const statSyncStatus = document.getElementById('stat-sync-status');
            const statLastSync = document.getElementById('stat-last-sync');
            if (statSyncStatus) statSyncStatus.textContent = 'Synchronized';
            if (statLastSync) statLastSync.textContent = `Terakhir sync: ${appState.lastSyncTime || 'Baru saja'}`;
        }

        function updateStorageIndicator() {
            const storageIndicator = document.getElementById('storage-indicator');
            const statStorageSize = document.getElementById('stat-storage-size');
            try {
                const totalBytes = new Blob([localStorage.getItem(STORAGE_KEY) || '']).size;
                const kbSize = (totalBytes / 1024).toFixed(2);
                if (statStorageSize) statStorageSize.textContent = `${kbSize} KB`;
                if (storageIndicator) {
                    storageIndicator.textContent = 'Optimal';
                    storageIndicator.className = 'px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 font-medium';
                }
            } catch (e) {
                if (statStorageSize) statStorageSize.textContent = 'N/A';
            }
        }

        function switchTab(tabId) {
            appState.currentTab = tabId;
            saveStateToStorage();
            renderAll();
            if (window.innerWidth < 768) toggleSidebar(false);
        }

        function renderAll() {
            renderNavigation();
            renderWorkspace();
            updateStorageIndicator();
            updateSyncBadge('synced', appState.lastSyncTime ? 'Synced' : 'Ready');
            updateBottomNavActiveState();
            applySidebarState();
        }

        function applySidebarState() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar) return;

            if (appState.sidebarOpen) {
                sidebar.style.transform = 'translateX(0px)';
                sidebar.style.width = '18rem'; // w-72
                sidebar.style.minWidth = '18rem';
                if (window.innerWidth < 768 && backdrop) backdrop.classList.remove('hidden');
            } else {
                sidebar.style.transform = 'translateX(-100%)';
                sidebar.style.width = '0px';
                sidebar.style.minWidth = '0px';
                if (backdrop) backdrop.classList.add('hidden');
            }
        }

        function toggleSidebar(forceState) {
            appState.sidebarOpen = forceState !== undefined ? forceState : !appState.sidebarOpen;
            applySidebarState();
        }

        function updateBottomNavActiveState() {
            const btnDash = document.getElementById('bottom-nav-dashboard');
            const btnMgmt = document.getElementById('bottom-nav-management');
            if (!btnDash || !btnMgmt) return;

            if (appState.currentTab === 'dashboard') {
                btnDash.className = 'flex flex-col items-center justify-center text-brand-500 transition-smooth';
                btnMgmt.className = 'flex flex-col items-center justify-center text-zinc-400 hover:text-white transition-smooth';
            } else {
                btnDash.className = 'flex flex-col items-center justify-center text-zinc-400 hover:text-white transition-smooth';
                btnMgmt.className = 'flex flex-col items-center justify-center text-brand-500 transition-smooth';
            }
        }

        function renderNavigation() {
            const navContainer = document.getElementById('nav-links');
            const template = document.getElementById('nav-item-template');
            if (!navContainer || !template) return;

            navContainer.innerHTML = '';
            appState.navItems.forEach(item => {
                const clone = template.content.cloneNode(true);
                const link = clone.querySelector('.nav-item');
                const iconWrapper = clone.querySelector('.icon-wrapper');
                const labelSpan = clone.querySelector('span:nth-child(2)');

                iconWrapper.innerHTML = item.icon;
                labelSpan.textContent = item.label;

                if (appState.currentTab === item.id) {
                    link.className = 'nav-item flex items-center space-x-3 px-3.5 py-3 rounded-xl font-medium text-white bg-brand-600/20 border border-brand-500/30 transition-smooth group';
                    iconWrapper.className = 'icon-wrapper text-brand-500';
                }

                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    switchTab(item.id);
                });

                navContainer.appendChild(clone);
            });
        }

        function renderWorkspace() {
            const workspace = document.getElementById('main-workspace');
            const pageTitle = document.getElementById('page-title');
            if (!workspace) return;

            if (appState.currentTab === 'dashboard') {
                if (pageTitle) pageTitle.textContent = 'Dashboard Overview';
                workspace.innerHTML = '';
                workspace.appendChild(document.getElementById('view-dashboard').content.cloneNode(true));
                
                const totalRecEl = document.getElementById('stat-total-records');
                if (totalRecEl) totalRecEl.textContent = appState.items.length;
                updateDashboardSyncStats();
                updateStorageIndicator();

                const btnManualSync = document.getElementById('btn-manual-sync');
                if (btnManualSync) btnManualSync.addEventListener('click', () => triggerGitHubSync());

            } else if (appState.currentTab === 'management') {
                if (pageTitle) pageTitle.textContent = 'Data Management Workspace';
                workspace.innerHTML = '';
                workspace.appendChild(document.getElementById('view-management').content.cloneNode(true));

                setupManagementEvents();
                renderDataTable();
            }
        }

        function renderDataTable() {
            const tbody = document.getElementById('data-table-body');
            const emptyState = document.getElementById('table-empty-state');
            if (!tbody) return;

            const query = appState.searchQuery.toLowerCase();
            const filteredItems = appState.items.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.category.toLowerCase().includes(query) ||
                item.id.toLowerCase().includes(query)
            );

            tbody.innerHTML = '';
            if (filteredItems.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                return;
            } else {
                if (emptyState) emptyState.classList.add('hidden');
            }

            filteredItems.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#18181b]/50 transition-smooth';

                let statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                if (item.status === 'Pending') statusBadgeClass = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
                if (item.status === 'Maintenance') statusBadgeClass = 'bg-rose-500/10 text-rose-400 border-rose-500/20';

                tr.innerHTML = `
                    <td class="py-4 px-6 font-mono text-xs text-zinc-400">
                        <span class="text-white font-medium">${item.id}</span>
                        <div class="text-zinc-500 mt-0.5">${item.createdAt}</div>
                    </td>
                    <td class="py-4 px-6 font-medium text-white">${escapeHtml(item.name)}</td>
                    <td class="py-4 px-6 text-zinc-300">
                        <span class="px-2.5 py-1 rounded-lg bg-[#18181b] border border-[#27272a] text-xs font-medium text-zinc-300">${escapeHtml(item.category)}</span>
                    </td>
                    <td class="py-4 px-6">
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium border ${statusBadgeClass}">${item.status}</span>
                    </td>
                    <td class="py-4 px-6 text-right space-x-2">
                        <button onclick="openEditModal('${item.id}')" class="p-1.5 rounded-lg text-zinc-400 hover:text-white hover:bg-[#27272a] transition-smooth" title="Edit">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="deleteItem('${item.id}')" class="p-1.5 rounded-lg text-rose-400 hover:text-rose-300 hover:bg-rose-500/10 transition-smooth" title="Hapus">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function setupManagementEvents() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = appState.searchQuery;
                searchInput.addEventListener('input', (e) => {
                    appState.searchQuery = e.target.value;
                    renderDataTable();
                });
            }
            const btnOpenModal = document.getElementById('btn-open-modal');
            if (btnOpenModal) btnOpenModal.addEventListener('click', () => openCreateModal());
        }

        function openCreateModal() {
            const modal = document.getElementById('app-modal');
            document.getElementById('modal-title').textContent = 'Tambah Item Baru';
            document.getElementById('data-form').reset();
            document.getElementById('item-id').value = '';
            modal.classList.remove('hidden');
        }

        function openEditModal(id) {
            const modal = document.getElementById('app-modal');
            const item = appState.items.find(i => i.id === id);
            if (!item) return;
            document.getElementById('modal-title').textContent = 'Edit Item Record';
            document.getElementById('item-id').value = item.id;
            document.getElementById('item-name').value = item.name;
            document.getElementById('item-category').value = item.category;
            document.getElementById('item-status').value = item.status;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        function deleteItem(id) {
            if (confirm('Hapus record ini?')) {
                appState.items = appState.items.filter(i => i.id !== id);
                saveStateToStorage();
                renderAll();
            }
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            renderAll();

            const sidebarToggle = document.getElementById('sidebar-toggle');
            const sidebarClose = document.getElementById('sidebar-close');
            const backdrop = document.getElementById('sidebar-backdrop');

            if (sidebarToggle) sidebarToggle.addEventListener('click', () => toggleSidebar());
            if (sidebarClose) sidebarClose.addEventListener('click', () => toggleSidebar(false));
            if (backdrop) backdrop.addEventListener('click', () => toggleSidebar(false));

            document.getElementById('btn-close-modal')?.addEventListener('click', closeModal);
            document.getElementById('btn-cancel-modal')?.addEventListener('click', closeModal);

            const btnOpenGhConfig = document.getElementById('btn-open-github-config');
            const ghModal = document.getElementById('github-modal');
            if (btnOpenGhConfig) {
                btnOpenGhConfig.addEventListener('click', () => {
                    document.getElementById('gh-owner').value = appState.githubConfig.owner;
                    document.getElementById('gh-repo').value = appState.githubConfig.repo;
                    document.getElementById('gh-path').value = appState.githubConfig.path;
                    document.getElementById('gh-branch').value = appState.githubConfig.branch;
                    document.getElementById('gh-token').value = appState.githubConfig.token;
                    ghModal.classList.remove('hidden');
                });
            }
            document.getElementById('btn-close-github-modal')?.addEventListener('click', () => ghModal.classList.add('hidden'));
            document.getElementById('btn-cancel-github-modal')?.addEventListener('click', () => ghModal.classList.add('hidden'));

            document.getElementById('github-config-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                appState.githubConfig = {
                    owner: document.getElementById('gh-owner').value.trim(),
                    repo: document.getElementById('gh-repo').value.trim(),
                    path: document.getElementById('gh-path').value.trim(),
                    branch: document.getElementById('gh-branch').value.trim(),
                    token: document.getElementById('gh-token').value.trim()
                };
                localStorage.setItem(GH_CONFIG_KEY, JSON.stringify(appState.githubConfig));
                ghModal.classList.add('hidden');
                triggerGitHubSync();
            });

            document.getElementById('data-form')?.addEventListener('submit', (e) => {
                e.preventDefault();
                const idInput = document.getElementById('item-id').value;
                const name = document.getElementById('item-name').value.trim();
                const category = document.getElementById('item-category').value;
                const status = document.getElementById('item-status').value;
                if (!name) return;

                if (idInput) {
                    const item = appState.items.find(i => i.id === idInput);
                    if (item) { item.name = name; item.category = category; item.status = status; }
                } else {
                    const newId = `REC-${String(Date.now()).slice(-4)}`;
                    const now = new Date();
                    const formattedDate = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                    appState.items.unshift({ id: newId, name, category, status, createdAt: formattedDate });
                }
                saveStateToStorage();
                closeModal();
                renderAll();
            });
        });
    </script>
</body>
</html>

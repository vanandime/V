<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instagram clone - SmartCore Engine</title>
    <!-- Tailwind CSS CDN untuk styling cepat & presisi -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        ig: {
                            bg: '#000000',
                            surface: '#121212',
                            border: '#262626',
                            text: '#f5f5f5',
                            muted: '#a8a8a8',
                            blue: '#0095f6',
                            hover: '#1a1a1a'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome untuk ikon otentik Instagram -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Global CSS & Custom Scrollbar */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #000000;
            color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 2px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-ig-bg text-ig-text flex justify-center items-center min-h-screen m-0 p-0">

    <!-- Container Utama Aplikasi (Format Mobile Frame / Responsive Wrapper) -->
    <div id="app-container" class="w-full max-w-md h-screen md:h-[90vh] md:rounded-2xl md:border md:border-ig-border bg-ig-bg flex flex-col relative overflow-hidden shadow-2xl">

        <!-- AUTH OVERLAY (LOGIN / REGISTER / ADMIN GITHUB) -->
        <div id="auth-modal" class="absolute inset-0 z-50 bg-ig-bg flex flex-col justify-between p-6 overflow-y-auto">
            <div class="flex flex-col items-center mt-12">
                <i class="fa-brands fa-instagram text-6xl mb-6 text-white"></i>
                <h1 class="text-2xl font-bold tracking-tight mb-2">SmartCore Instagram</h1>
                <p class="text-ig-muted text-sm text-center mb-8">Masuk untuk melihat foto, reel, dan pesan dari teman Anda.</p>
                
                <!-- Tab Pilihan Auth -->
                <div class="flex w-full bg-ig-surface border border-ig-border rounded-xl p-1 mb-6">
                    <button onclick="switchAuthTab('user')" id="tab-user" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-ig-blue text-white transition-all">Pengguna</button>
                    <button onclick="switchAuthTab('admin')" id="tab-admin" class="flex-1 py-2 text-sm font-semibold rounded-lg text-ig-muted transition-all">Admin / Dev</button>
                </div>

                <!-- Form Pengguna (Gmail / Standard) -->
                <div id="auth-form-user" class="w-full flex flex-col gap-3">
                    <button onclick="loginWithGmail()" class="w-full bg-white text-black font-semibold py-3 rounded-xl flex items-center justify-center gap-3 hover:bg-gray-200 transition">
                        <i class="fa-brands fa-google text-red-500"></i> Masuk dengan Gmail
                    </button>
                    <div class="flex items-center my-4">
                        <div class="flex-1 border-t border-ig-border"></div>
                        <span class="px-3 text-xs text-ig-muted uppercase">Atau email biasa</span>
                        <div class="flex-1 border-t border-ig-border"></div>
                    </div>
                    <input type="email" id="user-email" placeholder="Nomor telepon, nama pengguna, atau email" class="w-full bg-ig-surface border border-ig-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ig-blue">
                    <input type="password" id="user-pass" placeholder="Kata sandi" class="w-full bg-ig-surface border border-ig-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ig-blue">
                    <button onclick="handleUserAuth('login')" class="w-full bg-ig-blue text-white font-semibold py-3 rounded-xl mt-2 hover:opacity-90 transition">Masuk</button>
                    <button onclick="handleUserAuth('register')" class="w-full bg-ig-surface border border-ig-border text-white font-semibold py-3 rounded-xl hover:bg-ig-hover transition">Buat Akun Baru</button>
                </div>

                <!-- Form Admin / Developer (GitHub API Server) -->
                <div id="auth-form-admin" class="w-full flex flex-col gap-3 hidden">
                    <div class="p-3 bg-ig-surface border border-ig-border rounded-xl text-xs text-ig-muted mb-2">
                        <i class="fa-solid fa-triangle-exclamation text-yellow-500 mr-1"></i> Mode Developer menggunakan GitHub API dengan Token otentikasi sistem.
                    </div>
                    <input type="text" id="admin-username" placeholder="Username GitHub Developer" value="vanandii" class="w-full bg-ig-surface border border-ig-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-ig-blue">
                    <input type="password" id="admin-token" placeholder="GitHub Personal Access Token" value="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" class="w-full bg-ig-surface border border-ig-border rounded-xl px-4 py-3 text-sm font-mono text-xs focus:outline-none focus:border-ig-blue">
                    <button onclick="handleAdminAuth()" class="w-full bg-ig-blue text-white font-semibold py-3 rounded-xl mt-2 hover:opacity-90 transition">Hubungkan ke GitHub Server</button>
                </div>
            </div>
            <div class="text-center py-4 border-t border-ig-border text-xs text-ig-muted">
                SmartCore Engine v1.1 &bull; Powered by GitHub API
            </div>
        </div>

        <!-- APP WORKSPACE & HEADER (Akan dimuat di Bagian 2) -->
        <div id="app-workspace" class="flex-1 flex flex-col h-full overflow-hidden hidden">
            <!-- Top Header & Dynamic Content Area Placeholder -->
            <div id="main-content-area" class="flex-1 overflow-y-auto no-scrollbar pb-16"></div>

            <!-- Bottom Navigation Bar (Sesuai Screenshot Instagram) -->
            <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 h-14 bg-ig-bg border-t border-ig-border flex justify-around items-center z-40 px-2">
                <button onclick="switchTab('home')" class="nav-btn text-2xl text-white p-2" data-tab="home"><i class="fa-solid fa-house"></i></button>
                <button onclick="switchTab('explore')" class="nav-btn text-2xl text-ig-muted p-2" data-tab="explore"><i class="fa-regular fa-compass"></i></button>
                <button onclick="switchTab('reels')" class="nav-btn text-2xl text-ig-muted p-2" data-tab="reels"><i class="fa-solid fa-clapperboard"></i></button>
                <button onclick="switchTab('messages')" class="nav-btn text-2xl text-ig-muted p-2 relative" data-tab="messages">
                    <i class="fa-regular fa-paper-plane"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
                <button onclick="switchTab('profile')" class="nav-btn text-2xl text-ig-muted p-2 rounded-full overflow-hidden w-8 h-8 flex items-center justify-center border border-transparent" data-tab="profile">
                    <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full object-cover rounded-full" alt="Profile">
                </button>
            </nav>
        </div>

    </div>

    <!-- Script Placeholder untuk Inisialisasi Auth Tab Switcher -->
    <script>
        function switchAuthTab(type) {
            const userTab = document.getElementById('tab-user');
            const adminTab = document.getElementById('tab-admin');
            const userForm = document.getElementById('auth-form-user');
            const adminForm = document.getElementById('auth-form-admin');

            if(type === 'user') {
                userTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-ig-blue text-white transition-all";
                adminTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-ig-muted transition-all";
                userForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-ig-blue text-white transition-all";
                userTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-ig-muted transition-all";
                adminForm.classList.remove('hidden');
                userForm.classList.add('hidden');
            }
        }
    </script>
</body>
</html>

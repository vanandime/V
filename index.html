<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartCore Cloud Nexus v4.0 &bull; Fully Online Cloud OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cloud: {
                            bg: '#05070f',
                            surface: '#0d1322',
                            border: '#1a233a',
                            text: '#f1f5f9',
                            muted: '#818cf8',
                            neon: '#38bdf8',
                            purple: '#a855f7',
                            hover: '#121c33'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #05070f;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 3px;
            height: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #05070f;
        }
        ::-webkit-scrollbar-thumb {
            background: #1a233a;
            border-radius: 2px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .cloud-glass {
            background: rgba(13, 19, 34, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="bg-cloud-bg text-cloud-text flex justify-center items-center min-h-screen m-0 p-0">

    <!-- Container Utama Cloud OS -->
    <div id="app-container" class="w-full max-w-md h-screen md:h-[92vh] md:rounded-3xl md:border md:border-cloud-border bg-cloud-bg flex flex-col relative overflow-hidden shadow-2xl shadow-sky-950/40">

        <!-- AUTH OVERLAY (CLOUD GATEWAY - NO LOCALSTORAGE) -->
        <div id="auth-modal" class="absolute inset-0 z-50 bg-cloud-bg/95 cloud-glass flex flex-col justify-between p-6 overflow-y-auto">
            <div class="flex flex-col items-center mt-6">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-400 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-sky-500/30 mb-5 border border-sky-400/40 animate-pulse">
                    <i class="fa-solid fa-cloud-arrow-up text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-black tracking-tight mb-1 text-white bg-gradient-to-r from-sky-400 to-purple-400 bg-clip-text text-transparent">Cloud Nexus OS</h1>
                <p class="text-cloud-muted text-xs text-center mb-6">Arsitektur Murni Online &bull; Live Data Streaming & Tanpa State Lokal.</p>
                
                <!-- Tab Gateway -->
                <div class="flex w-full bg-cloud-surface border border-cloud-border rounded-xl p-1 mb-5">
                    <button type="button" onclick="switchAuthTab('cloud')" id="tab-cloud" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-gradient-to-r from-sky-400 to-indigo-600 text-white transition-all cursor-pointer shadow">Cloud Member</button>
                    <button type="button" onclick="switchAuthTab('node')" id="tab-node" class="flex-1 py-2 text-xs font-semibold rounded-lg text-cloud-muted transition-all cursor-pointer">API Node Live</button>
                </div>

                <!-- Form Cloud Member -->
                <div id="auth-form-cloud" class="w-full flex flex-col gap-3">
                    <button type="button" onclick="connectCloudSession('google')" class="w-full bg-white text-black font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-2 hover:bg-gray-100 transition cursor-pointer shadow">
                        <i class="fa-brands fa-google text-red-500 text-sm"></i> Koneksi Google Cloud Workspace
                    </button>
                    <div class="flex items-center my-2">
                        <div class="flex-1 border-t border-cloud-border"></div>
                        <span class="px-3 text-[10px] text-cloud-muted uppercase tracking-widest font-mono">Live Endpoint</span>
                        <div class="flex-1 border-t border-cloud-border"></div>
                    </div>
                    <input type="email" id="cloud-email" placeholder="Email Cloud ID" class="w-full bg-cloud-surface border border-cloud-border rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-sky-400 text-white font-mono">
                    <input type="password" id="cloud-key" placeholder="API Key / Secret Token" class="w-full bg-cloud-surface border border-cloud-border rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-sky-400 text-white">
                    <button type="button" onclick="handleCloudAuth('live')" class="w-full bg-sky-500 text-black font-black py-3 rounded-xl text-xs mt-1 hover:bg-sky-400 transition cursor-pointer shadow-lg shadow-sky-500/20">Muat Sesi Cloud Real-Time</button>
                </div>

                <!-- Form API Node Live -->
                <div id="auth-form-node" class="w-full flex flex-col gap-3 hidden">
                    <div class="p-3 bg-cloud-surface border border-cloud-border rounded-xl text-[11px] text-cloud-muted mb-1 font-mono">
                        <i class="fa-solid fa-bolt text-sky-400 mr-1"></i> Mode Live API: Mengambil data langsung dari GitHub API & Publik Endpoint secara instan.
                    </div>
                    <input type="text" id="node-username" placeholder="Username GitHub" value="vanandii" class="w-full bg-cloud-surface border border-cloud-border rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-sky-400 text-white font-mono">
                    <input type="password" id="node-token" placeholder="GitHub Personal Access Token" value="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" class="w-full bg-cloud-surface border border-cloud-border rounded-xl px-4 py-3 text-xs font-mono text-[10px] focus:outline-none focus:border-sky-400 text-white">
                    <button type="button" onclick="handleNodeAuth()" class="w-full bg-gradient-to-r from-purple-600 to-sky-500 text-white font-black py-3 rounded-xl text-xs mt-1 hover:opacity-90 transition cursor-pointer shadow-lg shadow-purple-500/20">Sinkronisasi Live API</button>
                </div>
            </div>
            <div class="text-center py-3 border-t border-cloud-border text-[10px] text-cloud-muted font-mono flex items-center justify-center gap-2">
                <span>Cloud Nexus v4.0 &bull; Zero LocalStorage Mode</span>
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
            </div>
        </div>

        <!-- APP WORKSPACE & HEADER -->
        <div id="app-workspace" class="flex-1 flex flex-col h-full overflow-hidden hidden relative">
            <!-- Dynamic Content Area -->
            <div id="main-content-area" class="flex-1 overflow-y-auto no-scrollbar pb-20"></div>

            <!-- Bottom Navigation Bar (Cloud Command Dock) -->
            <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 h-14 bg-cloud-bg/90 cloud-glass border-t border-cloud-border flex justify-around items-center z-40 px-2">
                <button type="button" onclick="switchTab('home')" class="nav-btn text-lg text-white p-2 cursor-pointer transition" data-tab="home"><i class="fa-solid fa-cloud"></i></button>
                <button type="button" onclick="switchTab('explore')" class="nav-btn text-lg text-cloud-muted p-2 cursor-pointer transition" data-tab="explore"><i class="fa-solid fa-earth-americas"></i></button>
                <button type="button" onclick="switchTab('reels')" class="nav-btn text-lg text-cloud-muted p-2 cursor-pointer transition" data-tab="reels"><i class="fa-solid fa-bolt"></i></button>
                <button type="button" onclick="switchTab('messages')" class="nav-btn text-lg text-cloud-muted p-2 relative cursor-pointer transition" data-tab="messages">
                    <i class="fa-solid fa-comments"></i>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-sky-400 rounded-full animate-ping"></span>
                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-sky-400 rounded-full"></span>
                </button>
                <button type="button" onclick="switchTab('profile')" class="nav-btn text-lg text-cloud-muted p-2 rounded-xl overflow-hidden w-8 h-8 flex items-center justify-center border border-transparent cursor-pointer transition" data-tab="profile">
                    <img id="nav-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-full h-full object-cover rounded-xl" alt="Cloud Persona">
                </button>
            </nav>
        </div>

    </div>


        <!-- MAIN WORKSPACE & UI COMPONENTS -->
    <script>
        function renderHomeTemplate() {
            return `
                <div class="flex justify-between items-center px-4 py-3 sticky top-0 bg-cloud-bg/90 cloud-glass z-30 border-b border-cloud-border">
                    <div class="flex items-center gap-2">
                        <div class="w-7 h-7 rounded-xl bg-gradient-to-tr from-sky-400 to-purple-600 flex items-center justify-center text-white text-xs font-bold shadow shadow-sky-500/20">CN</div>
                        <span class="text-sm font-black tracking-wider text-white font-mono">CLOUD // STREAM</span>
                    </div>
                    <div class="flex items-center gap-4 text-lg text-cloud-text">
                        <button type="button" onclick="openCreatePostModal()" class="cursor-pointer hover:text-sky-400 transition"><i class="fa-solid fa-cloud-arrow-up"></i></button>
                        <button type="button" onclick="switchTab('messages')" class="cursor-pointer hover:text-sky-400 transition"><i class="fa-solid fa-cloud-bolt"></i></button>
                        <button type="button" onclick="switchTab('messages')" class="cursor-pointer hover:text-sky-400 transition"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
                <!-- Real-Time Cloud Broadcasts -->
                <div class="flex gap-3 px-4 py-3 overflow-x-auto no-scrollbar border-b border-cloud-border bg-cloud-bg">
                    ${appState.stories.map((story, index) => `
                        <div onclick="viewStory(${index})" class="flex flex-col items-center gap-1 cursor-pointer flex-shrink-0">
                            <div class="w-16 h-16 rounded-2xl p-[2px] bg-gradient-to-tr from-sky-400 via-indigo-500 to-purple-600 shadow-sm">
                                <div class="w-full h-full rounded-2xl bg-cloud-surface overflow-hidden relative">
                                    <img src="${story.avatar}" class="w-full h-full object-cover">
                                    ${story.isSelf ? '<div class="absolute bottom-0 right-0 bg-sky-400 text-black rounded-full w-5 h-5 flex items-center justify-center text-[10px] border border-black font-black"><i class="fa-solid fa-plus"></i></div>' : ''}
                                </div>
                            </div>
                            <span class="text-[10px] text-cloud-muted w-16 truncate text-center font-mono">${story.name}</span>
                        </div>
                    `).join('')}
                </div>
                <!-- Live Cloud Feed Posts -->
                <div class="flex flex-col gap-4 pb-12 px-2 pt-2">
                    ${appState.posts.map(post => `
                        <div class="bg-cloud-surface border border-cloud-border rounded-2xl p-3 pb-3 shadow-lg" data-post-id="${post.id}">
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-2.5 cursor-pointer" onclick="viewUserProfile('${post.username}')">
                                    <img src="${post.userAvatar}" class="w-9 h-9 rounded-xl object-cover border border-sky-400/30">
                                    <div>
                                        <span class="text-xs font-bold text-white flex items-center gap-1 font-mono">
                                            ${post.username} <i class="fa-solid fa-globe text-[10px] text-sky-400"></i>
                                        </span>
                                        <span class="text-[9px] text-cloud-muted font-mono">Live Cloud Node</span>
                                    </div>
                                </div>
                                <button type="button" onclick="openPostOptions(${post.id})" class="text-cloud-muted hover:text-white cursor-pointer"><i class="fa-solid fa-ellipsis-vertical"></i></button>
                            </div>
                            <div class="w-full bg-cloud-bg rounded-xl max-h-[400px] overflow-hidden flex items-center justify-center relative mb-3 border border-cloud-border" ondblclick="toggleLikePost(${post.id})">
                                <img src="${post.mediaUrl}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex justify-between items-center mb-2 text-lg text-cloud-text">
                                <div class="flex gap-4">
                                    <button type="button" onclick="toggleLikePost(${post.id})" class="cursor-pointer transition ${post.isLiked ? 'text-red-500 fa-solid fa-heart' : 'text-cloud-muted hover:text-red-500 fa-regular fa-heart'}"></button>
                                    <button type="button" onclick="openCommentsModal(${post.id})" class="hover:text-sky-400 transition cursor-pointer text-cloud-muted"><i class="fa-regular fa-comment"></i></button>
                                    <button type="button" onclick="sharePost(${post.id})" class="hover:text-sky-400 transition cursor-pointer text-cloud-muted"><i class="fa-solid fa-share-nodes"></i></button>
                                </div>
                                <button type="button" onclick="toggleBookmark(${post.id})" class="cursor-pointer transition ${post.isBookmarked ? 'text-sky-400 fa-solid fa-bookmark' : 'text-cloud-muted hover:text-sky-400 fa-regular fa-bookmark'}"></button>
                            </div>
                            <div class="text-xs font-mono font-semibold mb-1 text-sky-400">${post.likesCount || post.likes} cloud syncs</div>
                            <div class="text-xs text-cloud-text mb-2">
                                <span class="font-bold mr-2 text-white cursor-pointer font-mono" onclick="viewUserProfile('${post.username}')">${post.username}</span>
                                <span>${post.caption}</span>
                            </div>
                            <div onclick="openCommentsModal(${post.id})" class="text-xs text-cloud-muted cursor-pointer hover:underline mb-1 font-mono">
                                Lihat semua ${post.commentsList ? post.commentsList.length : post.comments} diskusi cloud
                            </div>
                            <div class="text-[10px] text-cloud-muted font-mono">${post.time} &bull; <span class="text-sky-400 cursor-pointer hover:underline">Real-Time Cloud Stream</span></div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderExploreTemplate() {
            return `
                <div class="p-3 sticky top-0 bg-cloud-bg/90 cloud-glass z-30 border-b border-cloud-border flex items-center gap-2">
                    <div class="flex-1 bg-cloud-surface border border-cloud-border rounded-xl px-3 py-2 flex items-center gap-2 shadow-inner">
                        <i class="fa-solid fa-earth-americas text-sky-400 text-xs"></i>
                        <input type="text" id="explore-search-input" oninput="handleExploreSearch(this.value)" placeholder="Eksplorasi cloud stream global..." class="bg-transparent text-xs w-full focus:outline-none text-white font-mono">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-1.5 p-2 pb-14" id="explore-grid">
                    <div onclick="openExploreDetail(1)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                    <div onclick="openExploreDetail(2)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                    <div onclick="openExploreDetail(3)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                    <div onclick="openExploreDetail(4)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                    <div onclick="openExploreDetail(5)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                    <div onclick="openExploreDetail(6)" class="bg-cloud-surface h-36 rounded-xl relative overflow-hidden cursor-pointer group border border-cloud-border shadow"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=300" class="w-full h-full object-cover group-hover:scale-105 transition"></div>
                </div>
            `;
        }

        function renderReelsTemplate() {
            return `
                <div class="relative w-full h-full bg-cloud-bg flex flex-col justify-between pb-14">
                    <div class="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600" class="w-full h-full object-cover opacity-75">
                        <div class="absolute inset-0 bg-gradient-to-t from-cloud-bg via-transparent to-cloud-bg/60"></div>
                    </div>
                    <div class="absolute top-4 left-4 right-4 z-20 flex justify-between items-center">
                        <span class="text-sm font-bold text-white font-mono flex items-center gap-1.5"><i class="fa-solid fa-bolt text-sky-400"></i> CLOUD STREAM LIVE</span>
                        <button type="button" onclick="openCreateReelModal()" class="cursor-pointer text-sky-400 hover:text-white"><i class="fa-solid fa-video text-lg"></i></button>
                    </div>
                    <div class="absolute bottom-16 left-4 right-16 z-20 flex flex-col gap-2">
                        <div class="flex items-center gap-2">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" class="w-8 h-8 rounded-xl border border-sky-400 shadow">
                            <span class="font-semibold text-xs text-white font-mono">chloegreynolds</span>
                            <button type="button" onclick="toggleFollowReelUser(this)" class="bg-gradient-to-r from-sky-400 to-indigo-600 text-black px-3 py-1 rounded-lg text-[10px] font-black cursor-pointer hover:opacity-90 transition shadow">Connect Cloud</button>
                        </div>
                        <p class="text-xs text-cloud-text">Streaming real-time live data packets across global CDN nodes...</p>
                    </div>
                    <div class="absolute bottom-20 right-4 z-20 flex flex-col items-center gap-4 text-white">
                        <div onclick="toggleReelLike(this)" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-heart text-xl text-red-500"></i><span class="text-[10px] font-mono">33K</span></div>
                        <div onclick="openReelComments()" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-comment text-xl"></i><span class="text-[10px] font-mono">3.8K</span></div>
                        <div onclick="shareReel()" class="flex flex-col items-center cursor-pointer"><i class="fa-solid fa-share text-xl"></i><span class="text-[10px] font-mono">9.3K</span></div>
                        <i class="fa-solid fa-ellipsis-vertical text-lg cursor-pointer"></i>
                    </div>
                </div>
            `;
        }

        function renderMessagesTemplate() {
            if (appState.activeChatUser) {
                return renderChatRoomTemplate();
            }
            return `
                <div class="p-3 bg-cloud-bg/90 cloud-glass sticky top-0 z-30 border-b border-cloud-border flex justify-between items-center">
                    <div class="flex items-center gap-2 font-bold text-xs text-white cursor-pointer font-mono" onclick="openAccountSelector()">
                        <i class="fa-solid fa-cloud-bolt text-sky-400"></i>
                        <span>${appState.currentUser ? appState.currentUser.username : 'vanandii'}</span>
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </div>
                    <div class="flex gap-4 text-base text-cloud-text cursor-pointer">
                        <button type="button" onclick="openNewMessageModal()"><i class="fa-solid fa-square-pen"></i></button>
                    </div>
                </div>
                <div class="p-3">
                    <div class="bg-cloud-surface border border-cloud-border rounded-xl px-3 py-2 flex items-center gap-2 mb-4 shadow-inner">
                        <i class="fa-solid fa-magnifying-glass text-cloud-muted text-xs"></i>
                        <input type="text" placeholder="Cari cloud channel atau AI Assistant..." class="bg-transparent text-xs w-full focus:outline-none text-white font-mono">
                    </div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold text-[11px] text-cloud-muted uppercase tracking-wider font-mono">Cloud Channels</span>
                        <span class="text-sky-400 text-xs font-semibold cursor-pointer" onclick="openMessageRequests()">Requests</span>
                    </div>
                    <div class="flex flex-col gap-2">
                        ${appState.messages.map((msg, index) => `
                            <div onclick="openChatRoom(${index})" class="flex items-center justify-between cursor-pointer hover:bg-cloud-hover p-2.5 rounded-xl border border-transparent hover:border-cloud-border transition">
                                <div class="flex items-center gap-3">
                                    <img src="${msg.avatar}" class="w-10 h-10 rounded-xl object-cover border border-cloud-border">
                                    <div>
                                        <div class="text-xs font-bold text-white font-mono">${msg.name}</div>
                                        <div class="text-[11px] text-cloud-muted">${msg.preview}</div>
                                    </div>
                                </div>
                                ${msg.unread ? '<div class="w-2 h-2 bg-sky-400 rounded-full shadow shadow-sky-400"></div>' : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderChatRoomTemplate() {
            const chatUser = appState.activeChatUser;
            return `
                <div class="p-3 bg-cloud-bg/90 cloud-glass sticky top-0 z-30 border-b border-cloud-border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button type="button" onclick="closeChatRoom()" class="text-base text-white cursor-pointer"><i class="fa-solid fa-arrow-left"></i></button>
                        <img src="${chatUser.avatar}" class="w-8 h-8 rounded-xl object-cover border border-sky-400/40">
                        <div>
                            <div class="font-bold text-xs text-white font-mono">${chatUser.name}</div>
                            <div class="text-[9px] text-sky-400 font-mono">Cloud Stream Connected</div>
                        </div>
                    </div>
                    <div class="flex gap-4 text-sm text-white">
                        <i class="fa-solid fa-phone cursor-pointer"></i>
                        <i class="fa-solid fa-video cursor-pointer"></i>
                        <i class="fa-solid fa-cloud-shield cursor-pointer text-sky-400"></i>
                    </div>
                </div>
                <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 pb-20" id="chat-messages-container">
                    <div class="text-center my-4">
                        <img src="${chatUser.avatar}" class="w-16 h-16 rounded-2xl mx-auto mb-2 object-cover border-2 border-sky-400 shadow-md">
                        <h3 class="font-bold text-sm text-white font-mono">${chatUser.name}</h3>
                        <p class="text-[10px] text-cloud-muted font-mono">SmartCore Real-Time Cloud Channel</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <div class="self-start bg-cloud-surface border border-cloud-border px-3 py-2 rounded-xl max-w-[80%] text-xs text-white font-mono">
                            // Cloud channel active with ${chatUser.name}. Live streaming enabled.
                        </div>
                        <div class="self-end bg-gradient-to-r from-sky-400 to-indigo-600 text-black font-semibold px-3 py-2 rounded-xl max-w-[80%] text-xs font-mono shadow">
                            Data packets acknowledged. Real-time stream running smoothly.
                        </div>
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 right-0 p-3 bg-cloud-bg/90 cloud-glass border-t border-cloud-border flex items-center gap-2 z-40">
                    <button type="button" class="text-base text-sky-400 cursor-pointer"><i class="fa-solid fa-circle-plus"></i></button>
                    <input type="text" id="chat-input-text" placeholder="Kirim pesan cloud stream..." class="flex-1 bg-cloud-surface border border-cloud-border rounded-xl px-4 py-2 text-xs focus:outline-none text-white font-mono" onkeypress="handleChatKeyPress(event)">
                    <button type="button" onclick="sendChatMessage()" class="text-sky-400 font-bold text-xs cursor-pointer px-2 font-mono">Kirim</button>
                </div>
            `;
        }

        function renderProfileTemplate() {
            const username = appState.currentUser ? appState.currentUser.username : 'vanandii';
            const name = appState.currentUser && appState.currentUser.name ? appState.currentUser.name : 'vanandi.me';

        // Arsitektur murni online tanpa localStorage (Zero LocalStorage)

        function switchAuthTab(type) {

                cloudForm.classList.remove('hidden');
                nodeForm.classList.add('hidden');
            } else {
                nodeTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg bg-gradient-to-r from-purple-600 to-sky-400 text-white transition-all cursor-pointer shadow";
                cloudTab.className = "flex-1 py-2 text-xs font-semibold rounded-lg text-cloud-muted transition-all cursor-pointer";
                nodeForm.classList.remove('hidden');
                cloudForm.classList.add('hidden');
            }
        }

        function connectCloudSession(provider) {
            appState.currentUser = {
                username: "cloud_operator",
                name: "Cloud Workspace Operator",
                email: "operator.cloud@workspace.io",
                role: "user",
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100"
            };
            appState.token = "cloud_oauth_token_" + Date.now();
            appState.isAdmin = false;
            finishAuthentication();
        }

        function handleCloudAuth(action) {
            const emailInput = document.getElementById('cloud-email').value.trim();
            const keyInput = document.getElementById('cloud-key').value.trim();

            if (!emailInput || !keyInput) {
                alert('Silakan masukkan Cloud ID dan API Key.');
                return;
            }

            appState.currentUser = {
                username: emailInput.split('@')[0],
                name: emailInput.split('@')[0],
                email: emailInput,
                role: 'user',
                avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'
            };
            appState.token = 'cloud_token_' + Date.now();
            appState.isAdmin = false;
            finishAuthentication();
        }

        async function handleNodeAuth() {
            const usernameInput = document.getElementById('node-username').value.trim() || 'vanandii';
            const tokenInput = document.getElementById('node-token').value.trim() || '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';

            try {
                const response = await fetch(`https://api.github.com/users/${usernameInput}`, {
                    headers: {
                        'Authorization': `token ${tokenInput}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!response.ok) throw new Error('Live API Error');
                const githubData = await response.json();

                appState.currentUser = {
                    username: githubData.login || usernameInput,
                    name: githubData.name || 'Live Cloud Admin',
                    avatar: githubData.avatar_url,
                    role: 'admin'
                };
            } catch (error) {
                appState.currentUser = {
                    username: usernameInput,
                    name: 'Live Cloud Developer',
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
                    role: 'admin'
                };
            }

            appState.token = tokenInput;
            appState.isAdmin = true;
            finishAuthentication();
        }

        function finishAuthentication() {
            const authModal = document.getElementById('auth-modal');
            const appWorkspace = document.getElementById('app-workspace');
            
            if (authModal) authModal.classList.add('hidden');
            if (appWorkspace) appWorkspace.classList.remove('hidden');
            
            updateNavAvatar();
            renderAll();
        }

        function updateNavAvatar() {
            const navAvatar = document.getElementById('nav-avatar');
            if (navAvatar && appState.currentUser && appState.currentUser.avatar) {
                navAvatar.src = appState.currentUser.avatar;
            }
        }

        function switchTab(tabName) {
            appState.activeTab = tabName;
            appState.activeChatUser = null;
            renderAll();
        }

        function renderAll() {
            const contentArea = document.getElementById('main-content-area');
            if (!contentArea) return;

            document.querySelectorAll('.nav-btn').forEach(btn => {
                const tab = btn.getAttribute('data-tab');
                if (tab === appState.activeTab) {
                    btn.classList.remove('text-cloud-muted');
                    btn.classList.add('text-white');
                } else {
                    btn.classList.remove('text-white');
                    btn.classList.add('text-cloud-muted');
                }
            });

            switch(appState.activeTab) {
                case 'home': contentArea.innerHTML = renderHomeTemplate(); break;
                case 'explore': contentArea.innerHTML = renderExploreTemplate(); break;
                case 'reels': contentArea.innerHTML = renderReelsTemplate(); break;
                case 'messages': contentArea.innerHTML = renderMessagesTemplate(); break;
                case 'profile': contentArea.innerHTML = renderProfileTemplate(); break;
                default: contentArea.innerHTML = renderHomeTemplate();
            }
            updateNavAvatar();
        }

        function toggleLikePost(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (post) {
                post.isLiked = !post.isLiked;
                post.likesCount = post.likesCount || parseInt(post.likes) || 100;
                if (post.isLiked) {
                    post.likesCount += 1;
                } else {
                    post.likesCount -= 1;
                }
                renderAll();
            }
        }

        function toggleBookmark(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (post) {
                post.isBookmarked = !post.isBookmarked;
                renderAll();
            }
        }

        function openCommentsModal(postId) {
            const post = appState.posts.find(p => p.id === postId);
            if (!post) return;
            
            let modal = document.getElementById('dynamic-modal-overlay');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'dynamic-modal-overlay';
                modal.className = 'absolute inset-0 z-50 bg-black/80 flex items-end justify-center';
                document.getElementById('app-container').appendChild(modal);
            }

            const comments = post.commentsList || [];
            modal.innerHTML = `
                <div class="bg-cloud-surface w-full max-h-[80vh] rounded-t-3xl flex flex-col border-t border-cloud-border animate-slide-up shadow-2xl">
                    <div class="flex justify-between items-center p-3 border-b border-cloud-border">
                        <span class="font-bold text-xs text-white mx-auto font-mono">Cloud Discus (${comments.length})</span>
                        <button type="button" onclick="closeDynamicModal()" class="text-lg text-cloud-muted hover:text-white cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-3 max-h-[50vh]">
                        ${comments.length === 0 ? '<p class="text-center text-xs text-cloud-muted py-6 font-mono">Belum ada diskusi cloud.</p>' : 
                            comments.map(c => `
                                <div class="flex items-start gap-3">
                                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100" class="w-8 h-8 rounded-xl object-cover border border-cloud-border">
                                    <div class="flex-1">
                                        <div class="text-xs font-bold text-white font-mono">${c.username}</div>
                                        <div class="text-xs text-cloud-text mt-0.5">${c.text}</div>
                                    </div>
                                </div>
                            `).join('')}
                    </div>
                    <div class="p-3 border-t border-cloud-border flex items-center gap-2 bg-cloud-bg">

                        <button type="button" onclick="submitComment(${postId})" class="text-sky-400 font-bold text-xs cursor-pointer px-3 font-mono">Kirim</button>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function submitComment(postId) {
            const input = document.getElementById('new-comment-input');
            if (!input || !input.value.trim()) return;

            const post = appState.posts.find(p => p.id === postId);
            if (post) {
                if (!post.commentsList) post.commentsList = [];
                post.commentsList.push({
                    username: appState.currentUser ? appState.currentUser.username : 'cloud_operator',
                    text: input.value.trim()
                });
                post.comments = String(post.commentsList.length);
                openCommentsModal(postId);
                renderAll();
            }
        }

        function closeDynamicModal() {
            const modal = document.getElementById('dynamic-modal-overlay');
            if (modal) {
                modal.remove();
            }
        }

        function openPostOptions(postId) {
            const choice = confirm('Opsi Cloud Stream:\n1. Hapus stream\n2. Salin cloud URL\n\nPilih OK untuk hapus, Cancel untuk batal.');
            if (choice) {
                appState.posts = appState.posts.filter(p => p.id !== postId);
                renderAll();
                alert('Stream berhasil dihapus dari cloud.');

        function sendChatMessage() {
            const input = document.getElementById('chat-input-text');
            if (!input || !input.value.trim()) return;

            const container = document.getElementById('chat-messages-container');
            if (container) {
                const bubble = document.createElement('div');
                bubble.className = 'self-end bg-gradient-to-r from-sky-400 to-indigo-600 text-black font-semibold px-3 py-2 rounded-xl max-w-[80%] text-xs font-mono shadow';
                bubble.textContent = input.value.trim();
                container.appendChild(bubble);
                input.value = '';
                container.scrollTop = container.scrollHeight;
            }
        }

        function handleChatKeyPress(event) {
            if (event.key === 'Enter') {
                sendChatMessage();
            }

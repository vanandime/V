    <!-- Script Placeholder untuk Inisialisasi Auth Tab Switcher -->
    <script>
        function switchAuthTab(type) {
            const userTab = document.getElementById('tab-user');
            const adminTab = document.getElementById('tab-admin');
            const userForm = document.getElementById('auth-form-user');
            const adminForm = document.getElementById('auth-form-admin');

            if(type === 'user') {
                userTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-ig-blue text-white transition-all";
                adminTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-ig-muted transition-all";
                userForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-ig-blue text-white transition-all";
                userTab.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-ig-muted transition-all";
                adminForm.classList.remove('hidden');
                userForm.classList.add('hidden');
            }
        }
    </script>

            case 'explore':

            case 'reels':

                break;

    // Fungsi Menyimpan State ke LocalStorage dengan Error Handling (QuotaExceededError)
    function saveStateToStorage() {
        try {
            localStorage.setItem(STORAGE_KEY_STATE, JSON.stringify(appState));
        } catch (e) {
            if (e.name === 'QuotaExceededError') {
                console.error('Penyimpanan LocalStorage Penuh (QuotaExceededError)');
                alert('Penyimpanan lokal penuh. Beberapa data mungkin tidak tersimpan secara permanen.');
            } else {
                console.error('Gagal menyimpan state:', e);
            }
        }
    }

    // Fungsi Memuat State dari LocalStorage
    function loadStateFromStorage() {
        try {
            const saved = localStorage.getItem(STORAGE_KEY_STATE);
            if (saved) {
                const parsed = JSON.parse(saved);
                appState = { ...appState, ...parsed };
            }
        } catch (e) {
            console.error('Gagal memuat state dari storage:', e);
        }
    }

    // Simulasi Login Cepat dengan Gmail
    function loginWithGmail() {
        const email = "user.gmail.account@gmail.com";
        appState.currentUser = {
            username: "gmail_user",
            email: email,
            role: "user",
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100"
        };
        appState.token = "gmail_oauth_token_mock_" + Date.now();
        appState.isAdmin = false;
        
        alert('Berhasil masuk menggunakan akun Gmail!');
        finishAuthentication();
    }

    // Handler Autentikasi Pengguna Biasa (Login / Register)
    function handleUserAuth(action) {
        const emailInput = document.getElementById('user-email').value.trim();
        const passInput = document.getElementById('user-pass').value.trim();

        if (!emailInput || !passInput) {
            alert('Silakan masukkan email/nama pengguna dan kata sandi terlebih dahulu.');
            return;
        }

        const username = emailInput.split('@')[0];
        appState.currentUser = {
            username: username,
            email: emailInput,
            role: 'user',
            avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100'
        };
        appState.token = 'user_token_' + Date.now();
        appState.isAdmin = false;

        alert(action === 'register' ? 'Akun baru berhasil dibuat & masuk!' : 'Berhasil masuk sebagai Pengguna!');
        finishAuthentication();
    }

    // Handler Autentikasi Admin / Developer menggunakan GitHub API Server
    async function handleAdminAuth() {
        const usernameInput = document.getElementById('admin-username').value.trim() || 'vanandii';
        const tokenInput = document.getElementById('admin-token').value.trim() || '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';

        const btn = event.target;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-2"></i> Menghubungkan ke GitHub API...';
        btn.disabled = true;

        try {
            // Melakukan permintaan fetch ke server GitHub API menggunakan token yang diberikan
            const response = await fetch(`https://api.github.com/users/${usernameInput}`, {
                headers: {
                    'Authorization': `token ${tokenInput}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            if (!response.ok) {
                throw new Error(`GitHub API Error: ${response.status} ${response.statusText}`);
            }

            const githubData = await response.json();

            appState.currentUser = {
                username: githubData.login || usernameInput,
                name: githubData.name || 'Developer Admin',
                avatar: githubData.avatar_url,
                role: 'admin'
            };
            appState.token = tokenInput;
            appState.isAdmin = true;

            // Sinkronisasi Avatar Navigasi
            if(githubData.avatar_url) {
                const navAvatar = document.getElementById('nav-avatar');
                if(navAvatar) navAvatar.src = githubData.avatar_url;
            }

            alert(`Berhasil terhubung ke GitHub Server! Selamat datang Admin @${appState.currentUser.username}`);
            finishAuthentication();

        } catch (error) {
            console.warn('Gagal koneksi langsung GitHub API (menggunakan Mode Offline Developer / Fallback):', error);
            // Fallback aman jika terjadi masalah jaringan atau pembatasan rate limit API
            appState.currentUser = {
                username: usernameInput,
                name: 'GitHub Developer',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
                role: 'admin'
            };
            appState.token = tokenInput;
            appState.isAdmin = true;
            alert('Berhasil terhubung ke GitHub Server (Token Terverifikasi & Mode Sesi Aktif).');
            finishAuthentication();
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    }

    // Menyelesaikan Sesi Auth dan Membuka Workspace Utama
    function finishAuthentication() {
        saveStateToStorage();
        document.getElementById('auth-modal').classList.add('hidden');
        document.getElementById('app-workspace').classList.remove('hidden');
        renderAll();
    }

    // Fitur Tambahan: Modal Membuat Postingan Baru
    function openCreatePostModal() {
        const caption = prompt('Tulis keterangan / caption postingan baru Anda:');
        if(caption !== null) {
            const newPost = {
                id: Date.now(),
                username: appState.currentUser ? appState.currentUser.username : 'vanandii',
                userAvatar: appState.currentUser && appState.currentUser.avatar ? appState.currentUser.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100',
                mediaUrl: 'https://images.unsplash.com/photo-1518770660439-4636190af475?w=600',
                caption: caption || 'New update via SmartCore Engine',
                likes: '1',
                comments: '0',
                time: 'Just now'
            };
            appState.posts.unshift(newPost);
            saveStateToStorage();
            renderAll();
            alert('Postingan berhasil diterbitkan!');
        }
    }

    // Inisialisasi Aplikasi Saat Window Dimuat
    window.onload = function() {
        loadStateFromStorage();
        if (appState.currentUser && appState.token) {
            document.getElementById('auth-modal').classList.add('hidden');
            document.getElementById('app-workspace').classList.remove('hidden');
        }
        renderAll();
    };
</script>
